name: new-api-loadtest

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: loadtest
      POSTGRES_PASSWORD: loadtest
      POSTGRES_DB: new_api
    ports:
      - "127.0.0.1:${LOADTEST_POSTGRES_PORT:-15432}:5432"
    volumes:
      - loadtest_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loadtest -d new_api"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [loadtest]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:${LOADTEST_REDIS_PORT:-16379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [loadtest]

  mock-upstream:
    build:
      context: ./mock-upstream
    environment:
      TTFT_MS: ${MOCK_TTFT_MS:-100}
      RESPONSE_MS: ${MOCK_RESPONSE_MS:-500}
      STREAM_CHUNKS: ${MOCK_STREAM_CHUNKS:-20}
      STREAM_INTERVAL_MS: ${MOCK_STREAM_INTERVAL_MS:-50}
      ERROR_RATE: ${MOCK_ERROR_RATE:-0}
    ports:
      - "127.0.0.1:${LOADTEST_MOCK_PORT:-18080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/healthz"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [loadtest]

  pyroscope:
    image: grafana/pyroscope:1.13.2
    command: ["server"]
    ports:
      - "127.0.0.1:${LOADTEST_PYROSCOPE_PORT:-4040}:4040"
    networks: [loadtest]

  new-api:
    build:
      context: ../..
      dockerfile: Dockerfile.dev
      args:
        GOPROXY: ${GOPROXY:-https://goproxy.cn,https://proxy.golang.org,direct}
        GOSUMDB: ${GOSUMDB:-sum.golang.google.cn}
        GOTOOLCHAIN: ${GOTOOLCHAIN:-local}
    environment:
      SQL_DSN: postgresql://loadtest:loadtest@postgres:5432/new_api
      REDIS_CONN_STRING: redis://redis:6379/0
      SESSION_SECRET: loadtest-session-secret-not-for-production
      CRYPTO_SECRET: loadtest-crypto-secret-not-for-production
      TZ: Asia/Shanghai
      GIN_MODE: release
      BATCH_UPDATE_ENABLED: "true"
      SYNC_FREQUENCY: "2"
      SQL_MAX_OPEN_CONNS: ${SQL_MAX_OPEN_CONNS:-80}
      SQL_MAX_IDLE_CONNS: ${SQL_MAX_IDLE_CONNS:-40}
      SQL_MAX_LIFETIME: ${SQL_MAX_LIFETIME:-60}
      REDIS_POOL_SIZE: ${REDIS_POOL_SIZE:-100}
      ENABLE_METRICS: "true"
      METRICS_PORT: "8006"
      ENABLE_PPROF: "true"
      PYROSCOPE_URL: http://pyroscope:4040
      PYROSCOPE_APP_NAME: new-api-loadtest
      NODE_NAME: loadtest-node-1
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    ports:
      - "127.0.0.1:${LOADTEST_API_PORT:-3100}:3000"
      - "127.0.0.1:${LOADTEST_PPROF_PORT:-8005}:8005"
      - "127.0.0.1:${LOADTEST_METRICS_PORT:-8006}:8006"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mock-upstream:
        condition: service_healthy
      pyroscope:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3000/api/status | grep -q '\"success\"'"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 15s
    networks: [loadtest]

  seed:
    image: postgres:15-alpine
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: loadtest
      PGPASSWORD: loadtest
      PGDATABASE: new_api
      LOADTEST_USERS: ${LOADTEST_USERS:-1000}
    volumes:
      - ./seed/seed.sh:/seed/seed.sh:ro
      - ./seed/seed.sql:/seed/seed.sql:ro
    entrypoint: ["/bin/sh", "/seed/seed.sh"]
    depends_on:
      new-api:
        condition: service_healthy
    networks: [loadtest]

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.17.1
    environment:
      DATA_SOURCE_URI: postgres:5432/new_api?sslmode=disable
      DATA_SOURCE_USER: loadtest
      DATA_SOURCE_PASS: loadtest
    depends_on:
      postgres:
        condition: service_healthy
    networks: [loadtest]

  redis-exporter:
    image: oliver006/redis_exporter:v1.67.0
    command: ["--redis.addr=redis://redis:6379"]
    depends_on:
      redis:
        condition: service_healthy
    networks: [loadtest]

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.2
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    networks: [loadtest]

  prometheus:
    image: prom/prometheus:v3.2.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-remote-write-receiver
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - loadtest_prometheus:/prometheus
    ports:
      - "127.0.0.1:${LOADTEST_PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      new-api:
        condition: service_healthy
      postgres-exporter:
        condition: service_started
      redis-exporter:
        condition: service_started
      alertmanager:
        condition: service_started
    networks: [loadtest]

  alert-sink:
    build:
      context: ./alert-sink
    ports:
      - "127.0.0.1:${LOADTEST_ALERT_SINK_PORT:-19094}:8080"
    networks: [loadtest]

  alertmanager:
    image: prom/alertmanager:v0.28.1
    command: ["--config.file=/etc/alertmanager/alertmanager.yml", "--storage.path=/alertmanager"]
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - loadtest_alertmanager:/alertmanager
    ports:
      - "127.0.0.1:${LOADTEST_ALERTMANAGER_PORT:-9093}:9093"
    depends_on:
      alert-sink:
        condition: service_started
    networks: [loadtest]

  grafana:
    image: grafana/grafana:11.5.2
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-loadtest}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_DEFAULT_THEME: light
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - loadtest_grafana:/var/lib/grafana
    ports:
      - "127.0.0.1:${LOADTEST_GRAFANA_PORT:-3001}:3000"
    depends_on:
      prometheus:
        condition: service_started
      pyroscope:
        condition: service_started
    networks: [loadtest]

  k6:
    image: grafana/k6:0.57.0
    profiles: ["runner"]
    environment:
      BASE_URL: ${BASE_URL:-http://new-api:3000}
      LOAD_PROFILE: ${LOAD_PROFILE:-smoke}
      LOADTEST_USERS: ${LOADTEST_USERS:-1000}
      LOADTEST_TOKENS: ${LOADTEST_TOKENS:-}
      SMOKE_DURATION: ${SMOKE_DURATION:-1m}
      SMOKE_VUS: ${SMOKE_VUS:-10}
      BURST_MAX_DURATION: ${BURST_MAX_DURATION:-5m}
      CAPACITY_RATES: ${CAPACITY_RATES:-100,200,300,400,500,600,700,800}
      CAPACITY_RAMP_DURATION: ${CAPACITY_RAMP_DURATION:-30s}
      CAPACITY_STAGE_DURATION: ${CAPACITY_STAGE_DURATION:-2m}
      CAPACITY_PREALLOCATED_VUS: ${CAPACITY_PREALLOCATED_VUS:-500}
      CAPACITY_MAX_VUS: ${CAPACITY_MAX_VUS:-2000}
      K6_PROMETHEUS_RW_SERVER_URL: ${K6_PROMETHEUS_RW_SERVER_URL:-http://prometheus:9090/api/v1/write}
      K6_PROMETHEUS_RW_TREND_STATS: p(95),p(99),avg,max
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    volumes:
      - ./k6:/scripts:ro
      - ./results:/results
    command: ["run", "--out", "experimental-prometheus-rw", "--summary-export", "/results/summary.json", "/scripts/load.js"]
    depends_on:
      seed:
        condition: service_completed_successfully
      prometheus:
        condition: service_started
    networks: [loadtest]

networks:
  loadtest:
    driver: bridge

volumes:
  loadtest_postgres:
  loadtest_prometheus:
  loadtest_alertmanager:
  loadtest_grafana:
