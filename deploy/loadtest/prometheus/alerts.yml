groups:
  - name: new-api-availability
    rules:
      - alert: NewAPIInstanceDown
        expr: up{job="new-api",instance="new-api:8006"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "new-api metrics endpoint is unavailable"
          description: "Prometheus has failed to scrape new-api for 30 seconds."

      - alert: NewAPIHighErrorRate
        expr: |
          sum(rate(new_api_http_requests_total{route_tag="relay",status=~"5.."}[2m]))
          /
          clamp_min(sum(rate(new_api_http_requests_total{route_tag="relay"}[2m])), 0.001)
          > 0.05
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "new-api relay error rate exceeds 5%"
          description: "The two-minute relay HTTP 5xx ratio has remained above 5% for one minute."

      - alert: NewAPIHighP95Latency
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(new_api_http_request_duration_seconds_bucket{route="/v1/chat/completions"}[5m]))
          ) > 2
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "new-api chat P95 latency exceeds 2 seconds"
          description: "P95 latency has remained above 2 seconds for two minutes. Compare it with mock-upstream latency and pool saturation."

      - alert: NewAPIHighInFlightRequests
        expr: new_api_http_requests_in_flight > 900
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "new-api has more than 900 in-flight requests"
          description: "Sustained high concurrency can indicate downstream queuing or a connection bottleneck."

  - name: new-api-runtime
    rules:
      - alert: NewAPIHighHeapUsage
        expr: go_memstats_heap_alloc_bytes{job="new-api"} > 1.5e9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "new-api heap allocation exceeds 1.5 GB"
          description: "Inspect the Pyroscope memory profile and compare heap after load returns to zero."

      - alert: NewAPIHighGoroutineCount
        expr: go_goroutines{job="new-api"} > 5000
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "new-api goroutine count exceeds 5000"
          description: "Inspect the goroutine profile for blocked relay, database, or network operations."

      - alert: NewAPIDatabasePoolSaturated
        expr: |
          new_api_database_connections{database="main",state="in_use"}
          /
          clamp_min(new_api_database_connections{database="main",state="max_open"}, 1)
          > 0.85
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "new-api main database pool exceeds 85% utilization"
          description: "Check database query latency, locks, and connection wait rate before increasing the pool."

      - alert: NewAPIDatabaseConnectionWaits
        expr: rate(new_api_database_wait_count_total{database="main"}[2m]) > 1
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "new-api is waiting for database connections"
          description: "More than one database pool wait per second indicates pool saturation or slow queries."

      - alert: NewAPIRedisPoolTimeouts
        expr: rate(new_api_redis_pool_timeouts_total[2m]) > 0
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: "new-api Redis client pool is timing out"
          description: "Inspect Redis latency, server CPU, and REDIS_POOL_SIZE."

  - name: new-api-dependencies
    rules:
      - alert: PostgreSQLExporterDown
        expr: up{job="postgres",instance="postgres-exporter:9187"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL metrics are unavailable"
          description: "The PostgreSQL exporter cannot be scraped."

      - alert: RedisExporterDown
        expr: up{job="redis",instance="redis-exporter:9121"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "Redis metrics are unavailable"
          description: "The Redis exporter cannot be scraped."

      - alert: PostgreSQLConnectionPressure
        expr: |
          sum(pg_stat_activity_count)
          /
          clamp_min(pg_settings_max_connections, 1)
          > 0.85
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL connection use exceeds 85%"
          description: "Database-wide connection pressure is high. Check active queries and connection pool sizing."

      - alert: RedisRejectedConnections
        expr: increase(redis_rejected_connections_total[2m]) > 0
        labels:
          severity: critical
        annotations:
          summary: "Redis rejected client connections"
          description: "Redis reached a connection or resource limit during the load test."

      - alert: MockUpstreamUnexpectedErrors
        expr: rate(mock_openai_errors_total[2m]) > 0
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: "Mock upstream is returning errors"
          description: "Verify whether MOCK_ERROR_RATE was intentionally configured."

  - name: end-to-end-observability
    rules:
      - alert: ObservabilityTargetDown
        expr: up{monitoring_scope="remote",job=~"loki-alltoken|alloy-alltoken|node"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Observability target is unavailable on {{ $labels.host }}"
          description: "Prometheus has failed to scrape {{ $labels.job }} for two minutes. Check the SSH tunnel and the remote service before assuming the application is down."

      - alert: RemoteHostRootDiskLow
        expr: node_filesystem_avail_bytes{monitoring_scope="remote",host="alltoken",mountpoint="/",fstype!~"tmpfs|overlay"} < 20 * 1024 * 1024 * 1024
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Root disk free space is below 20 GiB on {{ $labels.host }}"
          description: "The remote observability disk guard may stop Loki and Alloy to protect the host. Inspect disk growth and Loki retention data."

      - alert: ObservabilityAlloyConfigInvalid
        expr: alloy_config_last_load_successful{monitoring_scope="remote",job="alloy-alltoken"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Alloy configuration is invalid on {{ $labels.host }}"
          description: "Alloy failed to load its latest configuration. Existing collection may be stale or stopped."

      - alert: ObservabilityLogEntriesDropped
        expr: sum by (host) (increase(loki_write_dropped_entries_total{monitoring_scope="remote",job="alloy-alltoken"}[5m])) > 0
        labels:
          severity: warning
        annotations:
          summary: "Alloy dropped log entries on {{ $labels.host }}"
          description: "At least one log entry was dropped in the last five minutes. Check Loki readiness, timestamp rejection, line size, and tunnel health."

  - name: alltoken-relay-production
    rules:
      - alert: AllTokenRelayHighFinalErrorRate
        expr: |
          (
            sum(rate(new_api_relay_requests_total{outcome="error"}[5m]))
            /
            clamp_min(sum(rate(new_api_relay_requests_total[5m])), 0.001)
          ) > 0.05
          and
          sum(rate(new_api_relay_requests_total[5m])) > 0.1
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "AllToken final relay error rate exceeds 5%"
          description: "Client-visible final errors have remained above 5% with meaningful traffic. Use error_class to distinguish ingress, quota, channel, upstream, timeout, and internal failures."

      - alert: AllTokenRelayHighRetryRatio
        expr: |
          (
            sum(rate(new_api_relay_retries_total[5m]))
            /
            clamp_min(sum(rate(new_api_relay_requests_total[5m])), 0.001)
          ) > 0.25
          and
          sum(rate(new_api_relay_requests_total[5m])) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "AllToken retry ratio exceeds 25%"
          description: "A sustained gap between upstream attempts and final requests indicates downstream instability, pending limits, rate limits, or account failover."

      - alert: AllTokenRelayHighP95Latency
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (rate(new_api_relay_request_duration_seconds_bucket[5m]))
          ) > 30
          and
          sum(rate(new_api_relay_requests_total[5m])) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "AllToken final relay P95 latency exceeds 30 seconds"
          description: "Compare final request latency with single-attempt latency, retries, and in-flight requests."

  - name: alltoken-channel-routing
    rules:
      - alert: AllTokenChannelCircuitOpen
        expr: new_api_routing_channel_circuit_state{state="open"} == 1
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "Channel {{ $labels.channel_id }} circuit is open"
          description: "AllToken has stopped routing new requests to this channel and is using the next configured channel."

      - alert: AllTokenUpstreamExhausted
        expr: increase(new_api_routing_final_errors_total{stable_code="305001"}[2m]) > 0
        labels:
          severity: critical
        annotations:
          summary: "All candidate channels are exhausted"
          description: "At least one client received 305001 in the last two minutes. Inspect channel routing and exhaustion panels."

      - alert: AllTokenMockChannelTokensLow
        expr: mock_channel_remaining_tokens > 0 and mock_channel_remaining_tokens < 300
        for: 15s
        labels:
          severity: warning
        annotations:
          summary: "Mock channel {{ $labels.channel_id }} token balance is low"
          description: "The deterministic channel has fewer than 300 mock tokens remaining."

      - alert: AllTokenMockChannelExhausted
        expr: mock_channel_remaining_tokens == 0
        for: 15s
        labels:
          severity: warning
        annotations:
          summary: "Mock channel {{ $labels.channel_id }} is exhausted"
          description: "Traffic should move to the next configured channel."

      - alert: AllTokenFailoverSurge
        expr: sum(rate(new_api_routing_channel_switch_total[2m])) > 1
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: "Channel switch rate exceeds one per second"
          description: "A sustained switch surge indicates an unstable primary channel or overly aggressive policy."
