apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 5s

  - name: Pyroscope
    uid: pyroscope
    type: grafana-pyroscope-datasource
    access: proxy
    url: http://pyroscope:4040
    editable: false

  - name: Loki AllToken
    uid: loki-alltoken
    type: loki
    access: proxy
    url: http://host.docker.internal:13100
    editable: false
    jsonData:
      maxLines: 1000
      derivedFields:
        - name: AllToken Request ID
          matcherRegex: '"request_id":"([^"\\]+)"'
          url: '${__value.raw}'
        - name: Upstream Request ID
          matcherRegex: '"upstream_request_id":"([^"\\]+)"'
          url: '${__value.raw}'
