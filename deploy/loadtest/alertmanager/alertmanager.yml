global:
  resolve_timeout: 1m

route:
  receiver: local-alert-sink
  group_by: [alertname, severity]
  group_wait: 10s
  group_interval: 30s
  repeat_interval: 15m

inhibit_rules:
  - source_matchers:
      - alertname="AllTokenClusterCircuitOpen"
    target_matchers:
      - alertname=~"AllTokenPoolTokensLow|AllTokenPoolExhausted"
    equal: [cluster_code]

receivers:
  - name: local-alert-sink
    webhook_configs:
      - url: http://alert-sink:8080/alerts
        send_resolved: true
