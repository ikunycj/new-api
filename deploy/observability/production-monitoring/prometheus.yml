global:
  scrape_interval: 5s
  evaluation_interval: 5s
  external_labels:
    environment: production
    host: alltoken

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [127.0.0.1:9093]

scrape_configs:
  - job_name: new-api
    static_configs:
      - targets: [127.0.0.1:8006]

  - job_name: node
    static_configs:
      - targets: [127.0.0.1:9100]

  - job_name: postgres
    static_configs:
      - targets: [127.0.0.1:9187]

  - job_name: redis
    static_configs:
      - targets: [127.0.0.1:9121]

  - job_name: loki-alltoken
    metrics_path: /metrics
    static_configs:
      - targets: [127.0.0.1:3100]

  - job_name: alloy-alltoken
    static_configs:
      - targets: [127.0.0.1:12345]

  - job_name: prometheus
    static_configs:
      - targets: [127.0.0.1:9090]
