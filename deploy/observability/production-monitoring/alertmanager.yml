global:
  resolve_timeout: 1m

route:
  receiver: alltoken-dashboard
  group_by: [alertname, severity, channel_id]
  group_wait: 10s
  group_interval: 30s
  repeat_interval: 30m

inhibit_rules:
  - source_matchers:
      - alertname="AllTokenChannelCircuitOpen"
    target_matchers:
      - alertname=~"AllTokenFailoverSurge|AllTokenHighRetryRatio"
    equal: [channel_id]

receivers:
  - name: alltoken-dashboard
