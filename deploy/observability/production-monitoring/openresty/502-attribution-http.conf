map $status $alltoken_log_5xx {
    default 0;
    ~^5 1;
}

map "$status|$upstream_http_x_alltoken_error_source|$upstream_http_x_alltoken_error_code|$upstream_header_time" $alltoken_502_type {
    default "";
    ~^502\|[^|]+\|alltoken\.upstream_exhausted\| application_retry_exhausted;
    ~^502\|openai\| application_openai_502;
    ~^502\|channel\| application_channel_502;
    ~^502\|alltoken\| application_internal_502;
    ~^502\|\|[^|]*\|.*-$ gateway_no_application_response;
    ~^502\| application_unclassified_502;
}

map $alltoken_502_type $alltoken_502_layer {
    default "";
    ~^application_ application;
    ~^gateway_ gateway;
}

log_format alltoken_5xx escape=json
    '{"time":"$time_iso8601",'
    '"request_id":"$request_id",'
    '"method":"$request_method",'
    '"uri":"$uri",'
    '"status":"$status",'
    '"error_layer":"$sent_http_x_alltoken_error_layer",'
    '"error_type":"$sent_http_x_alltoken_error_type",'
    '"app_error_source":"$upstream_http_x_alltoken_error_source",'
    '"app_error_code":"$upstream_http_x_alltoken_error_code",'
    '"alltoken_code":"$upstream_http_x_alltoken_code",'
    '"error_ref":"$upstream_http_x_alltoken_error_ref",'
    '"upstream_addr":"$upstream_addr",'
    '"upstream_status":"$upstream_status",'
    '"upstream_connect_time":"$upstream_connect_time",'
    '"upstream_header_time":"$upstream_header_time",'
    '"upstream_response_time":"$upstream_response_time",'
    '"request_time":"$request_time"}';
