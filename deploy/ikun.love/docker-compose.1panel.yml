# Complete, isolated Docker stack for new-api on the ikun.love host.
#
# The stack owns its PostgreSQL and Redis containers, network, and data
# volumes. It intentionally has no external-network attachment: the existing
# Sub2API service and its 1Panel containers are out of scope.

services:
  new-api:
    image: ${IMAGE_TAG:-new-api:ikun}
    container_name: ${CONTAINER:-ikun-new-api}
    restart: unless-stopped
    command: --log-dir /app/logs
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
      - "127.0.0.1:${METRICS_HOST_PORT:-8006}:${METRICS_PORT:-8006}"
    volumes:
      - ./data:/data
      - ./logs:/app/logs
    environment:
      SQL_DSN: postgresql://${POSTGRES_APP_USER:?POSTGRES_APP_USER is required}:${POSTGRES_APP_PASSWORD:?POSTGRES_APP_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}?sslmode=disable
      SQL_MAX_IDLE_CONNS: ${SQL_MAX_IDLE_CONNS:-10}
      SQL_MAX_OPEN_CONNS: ${SQL_MAX_OPEN_CONNS:-30}
      SQL_MAX_LIFETIME: ${SQL_MAX_LIFETIME:-60}
      REDIS_POOL_SIZE: ${REDIS_POOL_SIZE:-10}
      REDIS_CONN_STRING: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/${REDIS_DB:-0}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      CRYPTO_SECRET: ${CRYPTO_SECRET:?CRYPTO_SECRET is required}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      SESSION_COOKIE_TRUSTED_URL: ${SESSION_COOKIE_TRUSTED_URL:-}
      TRUSTED_REDIRECT_DOMAINS: ${TRUSTED_REDIRECT_DOMAINS:-ikun.love}
      TZ: ${TZ:-Asia/Shanghai}
      ERROR_LOG_ENABLED: ${ERROR_LOG_ENABLED:-true}
      BATCH_UPDATE_ENABLED: ${BATCH_UPDATE_ENABLED:-true}
      NODE_NAME: ${NODE_NAME:-ikun-new-api-1}
      NODE_TYPE: ${NODE_TYPE:-master}
      ENABLE_METRICS: ${ENABLE_METRICS:-true}
      METRICS_PORT: ${METRICS_PORT:-8006}
      METRICS_BIND_ADDRESS: ${METRICS_BIND_ADDRESS:-0.0.0.0}
      FAILOVER_PROMETHEUS_URL: ${FAILOVER_PROMETHEUS_URL:-}
      FAILOVER_ALERTMANAGER_URL: ${FAILOVER_ALERTMANAGER_URL:-}
      FAILOVER_GRAFANA_PUBLIC_URL: ${FAILOVER_GRAFANA_PUBLIC_URL:-}
      FAILOVER_MONITORING_USERNAME: ${FAILOVER_MONITORING_USERNAME:-}
      FAILOVER_MONITORING_PASSWORD: ${FAILOVER_MONITORING_PASSWORD:-}
      FAILOVER_MONITORING_BEARER_TOKEN: ${FAILOVER_MONITORING_BEARER_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ikun-new-api-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3000/api/status | grep -Eq '\"success\"[[:space:]]*:[[:space:]]*true' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  postgres:
    image: ${POSTGRES_IMAGE:-postgres:18.4-alpine}
    container_name: ${POSTGRES_CONTAINER:-ikun-new-api-postgres}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:?POSTGRES_ADMIN_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?POSTGRES_ADMIN_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_ADMIN_DB:-postgres}
      PGUSER: ${POSTGRES_ADMIN_USER:?POSTGRES_ADMIN_USER is required}
      PGDATABASE: ${POSTGRES_ADMIN_DB:-postgres}
      PGDATA: /var/lib/postgresql/18/docker
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - ikun-new-api-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  redis:
    image: ${REDIS_IMAGE:-redis:8.8.0}
    container_name: ${REDIS_CONTAINER:-ikun-new-api-redis}
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      REDISCLI_AUTH: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - redis-data:/data
    networks:
      - ikun-new-api-network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

volumes:
  postgres-data:
    name: ${POSTGRES_VOLUME:-ikun-new-api-postgres-data}
  redis-data:
    name: ${REDIS_VOLUME:-ikun-new-api-redis-data}

networks:
  ikun-new-api-network:
    name: ${NETWORK_NAME:-ikun-new-api-network}
    driver: bridge
