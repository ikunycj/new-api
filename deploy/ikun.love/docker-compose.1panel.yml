# Isolated Compose contract for new-api on the ikun.love host.
# It does not modify, restart, network with, or reuse the running Sub2API
# service. The initial install uses the dedicated `new_api` PostgreSQL
# database/role in the existing PostgreSQL container and Redis logical
# database 1 in the existing Redis container. It binds the application only to
# host loopback.

services:
  new-api:
    image: ${IMAGE_TAG:-new-api:ikun}
    container_name: ${CONTAINER:-ikun-new-api}
    restart: always
    command: --log-dir /app/logs
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
      - "127.0.0.1:${METRICS_HOST_PORT:-8006}:${METRICS_PORT:-8006}"
    volumes:
      - ./data:/data
      - ./logs:/app/logs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SQLITE_PATH: ${SQLITE_PATH:-/data/new-api.db?_busy_timeout=30000}
      SQL_DSN: ${SQL_DSN:?SQL_DSN is required}
      SQL_MAX_IDLE_CONNS: ${SQL_MAX_IDLE_CONNS:-10}
      SQL_MAX_OPEN_CONNS: ${SQL_MAX_OPEN_CONNS:-30}
      SQL_MAX_LIFETIME: ${SQL_MAX_LIFETIME:-60}
      REDIS_CONN_STRING: ${REDIS_CONN_STRING:?REDIS_CONN_STRING is required}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      CRYPTO_SECRET: ${CRYPTO_SECRET:?CRYPTO_SECRET is required}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      SESSION_COOKIE_TRUSTED_URL: ${SESSION_COOKIE_TRUSTED_URL:-}
      TRUSTED_REDIRECT_DOMAINS: ${TRUSTED_REDIRECT_DOMAINS:-ikun.love}
      TZ: ${TZ:-Asia/Shanghai}
      ERROR_LOG_ENABLED: ${ERROR_LOG_ENABLED:-true}
      BATCH_UPDATE_ENABLED: ${BATCH_UPDATE_ENABLED:-true}
      NODE_NAME: ${NODE_NAME:-ikun-new-api-1}
      NODE_TYPE: ${NODE_TYPE:-master}
      ENABLE_METRICS: ${ENABLE_METRICS:-true}
      METRICS_PORT: ${METRICS_PORT:-8006}
      METRICS_BIND_ADDRESS: ${METRICS_BIND_ADDRESS:-0.0.0.0}
      FAILOVER_PROMETHEUS_URL: ${FAILOVER_PROMETHEUS_URL:-}
      FAILOVER_ALERTMANAGER_URL: ${FAILOVER_ALERTMANAGER_URL:-}
      FAILOVER_GRAFANA_PUBLIC_URL: ${FAILOVER_GRAFANA_PUBLIC_URL:-}
      FAILOVER_MONITORING_USERNAME: ${FAILOVER_MONITORING_USERNAME:-}
      FAILOVER_MONITORING_PASSWORD: ${FAILOVER_MONITORING_PASSWORD:-}
      FAILOVER_MONITORING_BEARER_TOKEN: ${FAILOVER_MONITORING_BEARER_TOKEN:-}
    networks:
      - new-api-network
      - 1panel-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3000/api/status | grep -q '\"success\":[[:space:]]*true' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  new-api-network:
    driver: bridge
  1panel-network:
    external: true
