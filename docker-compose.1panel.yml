# Run new-api against the existing 1Panel PostgreSQL and Redis services.
#
# The 1Panel services must already be attached to the external
# `1panel-network` network. This file intentionally does not define or
# create PostgreSQL/Redis containers or volumes.
#
# Usage:
#   docker compose --env-file .env -f docker-compose.1panel.yml up -d --build

services:
  new-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: new-api:local
    container_name: new-api
    restart: always
    command: --log-dir /app/logs
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    ports:
      - "${APP_PORT:-3000}:3000"
      - "127.0.0.1:${METRICS_HOST_PORT:-8006}:${METRICS_PORT:-8006}"
    volumes:
      - ./data:/data
      - ./logs:/app/logs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SQL_DSN: postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@${POSTGRES_HOST:?POSTGRES_HOST is required}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:?POSTGRES_DB is required}
      SQL_MAX_IDLE_CONNS: ${SQL_MAX_IDLE_CONNS:-10}
      SQL_MAX_OPEN_CONNS: ${SQL_MAX_OPEN_CONNS:-30}
      SQL_MAX_LIFETIME: ${SQL_MAX_LIFETIME:-60}
      REDIS_CONN_STRING: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@${REDIS_HOST:?REDIS_HOST is required}:${REDIS_PORT:-6379}/${REDIS_DB:-1}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      CRYPTO_SECRET: ${CRYPTO_SECRET:?CRYPTO_SECRET is required}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      SESSION_COOKIE_TRUSTED_URL: ${SESSION_COOKIE_TRUSTED_URL:-}
      TZ: ${TZ:-Asia/Shanghai}
      ERROR_LOG_ENABLED: ${ERROR_LOG_ENABLED:-true}
      ACCESS_LOG_SUCCESS_SAMPLE_RATE: ${ACCESS_LOG_SUCCESS_SAMPLE_RATE:-1}
      BATCH_UPDATE_ENABLED: ${BATCH_UPDATE_ENABLED:-true}
      NODE_NAME: ${NODE_NAME:-new-api-node-1}
      NODE_TYPE: ${NODE_TYPE:-master}
      # Set MONITORING_ENABLED=false to stop application metrics and the
      # Prometheus/Alertmanager/Grafana integration. Nginx logs and channel
      # probes are independent and remain enabled.
      MONITORING_ENABLED: ${MONITORING_ENABLED:-true}
      OBSERVABILITY_EVENT_LOG_ENABLED: ${OBSERVABILITY_EVENT_LOG_ENABLED:-true}
      ENABLE_METRICS: ${ENABLE_METRICS:-true}
      METRICS_PORT: ${METRICS_PORT:-8006}
      METRICS_BIND_ADDRESS: ${METRICS_BIND_ADDRESS:-0.0.0.0}
      FAILOVER_PROMETHEUS_URL: ${FAILOVER_PROMETHEUS_URL:-}
      FAILOVER_ALERTMANAGER_URL: ${FAILOVER_ALERTMANAGER_URL:-}
      FAILOVER_GRAFANA_PUBLIC_URL: ${FAILOVER_GRAFANA_PUBLIC_URL:-}
      FAILOVER_MONITORING_USERNAME: ${FAILOVER_MONITORING_USERNAME:-}
      FAILOVER_MONITORING_PASSWORD: ${FAILOVER_MONITORING_PASSWORD:-}
      FAILOVER_MONITORING_BEARER_TOKEN: ${FAILOVER_MONITORING_BEARER_TOKEN:-}
    networks:
      - new-api-network
      - 1panel-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3000/api/status | grep -q '\"success\":[[:space:]]*true' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  new-api-network:
    driver: bridge
  1panel-network:
    external: true
